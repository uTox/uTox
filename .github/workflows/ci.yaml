on: [push, pull_request]

jobs:
  ci:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Linux GCC"
            os: ubuntu-24.04
            build: linux
            compiler: gcc
            werror: "ON"

          - name: "Linux Clang"
            os: ubuntu-24.04
            build: linux
            compiler: clang
            werror: "ON"

          - name: "Windows x64 (cross)"
            os: ubuntu-24.04
            build: windows
            compiler: x86_64-w64-mingw32-gcc
            werror: "OFF"

          - name: "macOS"
            os: macos-latest
            build: osx
            compiler: clang
            werror: "OFF"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 5
      - name: Install dependencies
        run: |
          set -ex
          if [ $BUILD = linux ]; then
            sudo apt update
            sudo DEBIAN_FRONTEND=noninteractive apt -yq install --no-install-recommends \
              cmake cmake-data check libdbus-1-dev libx11-dev libfreetype6-dev \
              libfontconfig1-dev libxrender-dev libxext-dev \
              libsodium-dev libopus-dev libvpx-dev \
              libopenal-dev libopenal-data libv4l-dev
            if [ "$COMPILER" = clang ]; then
              sudo DEBIAN_FRONTEND=noninteractive apt -yq install --no-install-recommends clang llvm
            fi
          elif [ $BUILD = windows ]; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt -yq install --no-install-recommends \
              cmake make gcc mingw-w64 gcc-mingw-w64 mingw-w64-common binutils-mingw-w64 \
              yasm nasm autoconf automake libtool pkg-config curl
          fi
        env:
          BUILD: ${{ matrix.build }}
          COMPILER: ${{ matrix.compiler }}
      - name: Build and test
        run: |
          set -ex
          if [ $BUILD = linux ]; then
            export CC="$COMPILER"
            if [ "$COMPILER" = clang ]; then
              export CXX=clang++
            else
              export CXX=g++
            fi
          fi
          if [ $BUILD = windows ]; then
            sh ./extra/ci/windows.sh
          else
            ./extra/ci/${BUILD}-before.sh
            ./extra/ci/filter_audio.sh
            ./extra/ci/${BUILD}-script.sh
          fi
        env:
          BUILD: ${{ matrix.build }}
          COMPILER: ${{ matrix.compiler }}
          ENABLE_WERROR: ${{ matrix.werror }}
      - name: Dump cache on failure
        if: failure()
        run: ./extra/ci/debug_failure.sh || true
        env:
          BUILD: ${{ matrix.build }}

  linux-musl:
    name: Linux musl (Alpine)
    runs-on: ubuntu-24.04
    container:
      image: alpine:3.21
    env:
      ENABLE_WERROR: "ON"
      STATIC_ALL: "ON"
      STATIC_TOXCORE: "ON"
      ENABLE_DBUS: "OFF"
      ENABLE_ASAN: "OFF"
      ENABLE_FILTERAUDIO: "ON"
      # Keep cache inside the workspace so debug_failure.sh can see it.
      CACHE_DIR: ${{ github.workspace }}/cache/linux-musl
    steps:
      - name: Install Alpine packages
        run: |
          apk add --no-cache \
            bash nodejs \
            build-base cmake git curl pkgconf linux-headers \
            autoconf automake libtool diffutils \
            yasm nasm \
            freetype-dev fontconfig-dev \
            libx11-dev libxrender-dev libxext-dev \
            openal-soft-dev \
            v4l-utils-dev

      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 5

      - name: Build and test
        run: |
          set -ex
          mkdir -p "$CACHE_DIR"
          ./extra/ci/linux-musl-before.sh
          ./extra/ci/linux-script.sh

      - name: Dump cache on failure
        if: failure()
        run: ./extra/ci/debug_failure.sh || true
        env:
          BUILD: linux-musl

  windows-cygwin:
    name: Windows x64 (Cygwin)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Configure git line endings
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 5

      - name: Install Cygwin
        uses: cygwin/cygwin-install-action@v6
        with:
          add-to-path: false
          # libuv 1.53 hangs CMake inside try_compile before it starts the compiler.
          packages: >
            mingw64-x86_64-gcc-core
            mingw64-x86_64-gcc-g++
            mingw64-x86_64-headers
            mingw64-x86_64-windows-default-manifest
            cmake
            libuv1=1.52.1-1
            make
            git
            curl
            autoconf
            automake
            libtool
            pkg-config
            yasm
            nasm
            patch
            perl
            file

      - name: Build µTox
        shell: D:\cygwin\bin\bash.exe --login -eo pipefail -o igncr '{0}'
        env:
          CHERE_INVOKING: 1
        run: |
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          sh ./extra/ci/windows.sh

  coverage:
    name: Linux coverage
    runs-on: ubuntu-24.04
    env:
      BUILD: linux
      ENABLE_COVERAGE: "ON"
      ENABLE_WERROR: "ON"
      CMAKE_BUILD_TYPE: Debug
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 5
      - name: Install dependencies
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt -yq install --no-install-recommends \
            cmake cmake-data check libdbus-1-dev libx11-dev libfreetype6-dev \
            libfontconfig1-dev libxrender-dev libxext-dev \
            libsodium-dev libopus-dev libvpx-dev \
            libopenal-dev libopenal-data libv4l-dev \
            python3-pip
          # Need gcovr >= 8.4 for --markdown (Job Summary); Ubuntu's apt package is older.
          python3 -m pip install --user --break-system-packages 'gcovr>=8.4'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build and test
        run: |
          set -ex
          ./extra/ci/linux-before.sh
          ./extra/ci/filter_audio.sh
          ./extra/ci/linux-script.sh
      - name: Coverage report
        if: success() || failure()
        run: |
          set -ex
          mkdir -p coverage-html
          # HTML details → artifact; Markdown → native Job Summary (GFM, not raw HTML).
          gcovr --root . \
            --filter 'src/' \
            --exclude '.*/tests/.*' \
            --exclude '.*/third_party/.*' \
            --html-details coverage-html/index.html \
            --html-theme github.green \
            --markdown "$GITHUB_STEP_SUMMARY" \
            --print-summary
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-html
          path: coverage-html/
